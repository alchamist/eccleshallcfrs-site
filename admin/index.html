<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Eccleshall CFRs</title>
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F7F5; color: #1A1A1A; min-height: 100vh; padding: 2rem 1rem; }
    .wrap { max-width: 740px; margin: 0 auto; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .logo { height: 52px; }
    .user-bar { font-size: 0.85rem; color: #6B7280; display: flex; align-items: center; gap: 0.75rem; }
    .logout { background: none; border: none; color: #C62828; cursor: pointer; font-size: 0.85rem; font-weight: 600; padding: 0; }
    .card { background: #fff; border: 1px solid #E0E0E0; border-radius: 10px; padding: 2rem; }
    .card + .card { margin-top: 1.5rem; }
    h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #1A1A1A; }
    h3 { font-size: 1rem; color: #1A1A1A; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem; color: #374151; }
    .field .note { font-weight: 400; color: #6B7280; }
    input[type=text], input[type=password], input[type=date], input[type=email] {
      width: 100%; padding: 0.65rem 0.85rem;
      border: 1px solid #D1D5DB; border-radius: 6px;
      font-size: 0.95rem; font-family: inherit; color: #1A1A1A; background: #fff;
      transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: #40916C; box-shadow: 0 0 0 3px rgba(64,145,108,0.12); }
    .upload-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .upload-label { padding: 0.5rem 1rem; background: #F3F4F6; border: 1px solid #D1D5DB; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; white-space: nowrap; }
    .upload-label:hover { background: #E5E7EB; }
    #img-file, #featured-file { display: none; }
    #upload-status { font-size: 0.82rem; color: #6B7280; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.7rem 1.6rem; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: background 0.15s; }
    .btn-primary { background: #2D6A4F; color: #fff; }
    .btn-primary:hover { background: #1B4332; }
    .btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.82rem; }
    .btn-ghost { background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; }
    .btn-ghost:hover { background: #E5E7EB; }
    .msg { margin-top: 1.25rem; padding: 0.9rem 1.1rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; display: none; }
    .msg-ok  { background: #D8F3DC; color: #1B4332; border: 1px solid #40916C; }
    .msg-err { background: #FDECEA; color: #9B1C1C; border: 1px solid #C62828; }
    /* EasyMDE overrides */
    .EasyMDEContainer { border-radius: 6px; overflow: hidden; }
    .CodeMirror { font-size: 0.95rem; }
    /* Media library */
    .media-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .media-hint { font-size: 0.82rem; color: #6B7280; margin-top: 0.35rem; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .media-item { position: relative; border: 2px solid #E0E0E0; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; aspect-ratio: 4/3; background: #F3F4F6; }
    .media-item:hover { border-color: #2D6A4F; }
    .media-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-item-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.7rem; padding: 0.2rem 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-empty { color: #6B7280; font-size: 0.9rem; padding: 1.5rem 0; text-align: center; }
    .media-loading { color: #6B7280; font-size: 0.9rem; padding: 1.5rem 0; text-align: center; }
    .media-inserted { border-color: #40916C !important; }
    /* Featured image */
    .featured-row { display: flex; gap: 0.75rem; align-items: center; }
    .featured-thumb { width: 108px; height: 80px; border: 2px dashed #D1D5DB; border-radius: 6px; background: #F9FAFB; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: #9CA3AF; overflow: hidden; flex-shrink: 0; text-align: center; }
    .featured-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .featured-controls { flex: 1; min-width: 0; }
    /* Media library mode tabs */
    .mode-tabs { display: flex; gap: 0.3rem; }
    .mode-tab { padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; border: 1px solid #D1D5DB; cursor: pointer; background: #F3F4F6; color: #374151; }
    .mode-tab.active { background: #2D6A4F; color: #fff; border-color: #2D6A4F; }
    .media-item-set { border-color: #7C3AED !important; }
    /* Status badges */
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-published { background: #D8F3DC; color: #1B4332; }
    .badge-draft     { background: #FEF3C7; color: #92400E; }
    .badge-archived  { background: #F3F4F6; color: #6B7280; }
    /* Published updates list */
    .update-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #F3F4F6; gap: 1rem; }
    .update-row:last-child { border-bottom: none; }
    .update-info { min-width: 0; flex: 1; }
    .update-date { font-size: 0.82rem; color: #6B7280; margin-right: 0.5rem; white-space: nowrap; }
    .update-title-text { font-size: 0.9rem; }
    .update-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-danger { background: #FDECEA; color: #9B1C1C; border: 1px solid #C62828; }
    .btn-danger:hover { background: #fca5a5; }
    .list-status { color: #6B7280; font-size: 0.9rem; padding: 1rem 0; text-align: center; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <img src="../images/ecfr-logo.png" alt="Eccleshall CFRs" class="logo">
    <div class="user-bar" id="user-bar" style="display:none;">
      <span id="user-label"></span>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </div>

  <!-- Login -->
  <div id="login-view" class="card">
    <h2>Admin login</h2>
    <form id="login-form">
      <div class="field">
        <label for="un">Username</label>
        <input type="text" id="un" required autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="ak">Access key</label>
        <input type="password" id="ak" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Log in</button>
    </form>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- Editor -->
  <div id="editor-view" style="display:none;">

    <!-- Published updates -->
    <div class="card">
      <div class="media-header">
        <h2 style="margin-bottom:0">Published updates</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadUpdates()">↻ Refresh</button>
      </div>
      <div id="updates-list"><p class="list-status">Loading…</p></div>
    </div>

    <div class="card">
      <h2 id="form-heading">New update</h2>
      <form id="post-form">
        <div class="field">
          <label for="title">Title *</label>
          <input type="text" id="title" required placeholder="Steve's fundraising bikeathon — September 2026">
        </div>
        <div class="field">
          <label for="date">Date *</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="summary">Summary <span class="note">(shown on the updates list — keep it short)</span></label>
          <input type="text" id="summary" placeholder="One sentence description for the preview card">
        </div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;">
          <div class="field" style="flex:1;min-width:160px;margin-bottom:0;">
            <label for="status">Status</label>
            <select id="status" style="width:100%;padding:0.65rem 0.85rem;border:1px solid #D1D5DB;border-radius:6px;font-size:0.95rem;font-family:inherit;color:#1A1A1A;background:#fff;">
              <option value="published">Published</option>
              <option value="draft">Draft</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="field" style="flex:1;min-width:160px;margin-bottom:0;">
            <label for="end-date">Hide from <span class="note">(optional)</span></label>
            <input type="date" id="end-date">
          </div>
        </div>
        <div style="height:1.25rem;"></div>
        <div class="field">
          <label>Featured image <span class="note">(shown as the card thumbnail on the updates list)</span></label>
          <div class="featured-row">
            <div id="featured-thumb" class="featured-thumb">No image<br>set</div>
            <div class="featured-controls">
              <input type="text" id="featured-url" placeholder="Paste a URL, or upload / choose from library below">
              <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;align-items:center;">
                <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('featured-file').click()">📎 Upload</button>
                <input type="file" id="featured-file" accept="image/png,image/jpeg,image/gif,image/webp">
                <button type="button" class="btn btn-ghost btn-sm" onclick="clearFeaturedImage()">✕ Clear</button>
                <span id="featured-status" style="font-size:0.82rem;color:#6B7280;"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Add image to body <span class="note">(uploads and inserts at the cursor in the editor)</span></label>
          <div class="upload-row">
            <label class="upload-label" for="img-file">📎 Choose image</label>
            <input type="file" id="img-file" accept="image/png,image/jpeg,image/gif,image/webp">
            <span id="upload-status">No image chosen</span>
          </div>
        </div>
        <div class="field">
          <label>Body *</label>
          <textarea id="body"></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" id="pub-btn">Publish update</button>
          <button type="button" class="btn btn-ghost" id="cancel-btn" style="display:none;" onclick="cancelEdit()">Cancel</button>
        </div>
      </form>
      <div class="msg" id="post-msg"></div>
    </div>

    <!-- Media library -->
    <div class="card" id="media-card">
      <div class="media-header">
        <div>
          <h3>Media library</h3>
          <p class="media-hint" id="media-hint">Click any image to insert it at the cursor position in the editor above.</p>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
          <div class="mode-tabs">
            <button type="button" class="mode-tab active" id="mode-insert" onclick="setMediaMode('insert')">Insert in body</button>
            <button type="button" class="mode-tab" id="mode-featured" onclick="setMediaMode('featured')">Set as featured</button>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadMedia()">↻ Refresh</button>
        </div>
      </div>
      <div id="media-grid" class="media-grid"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
var mde = null;
var auth = {
  username: sessionStorage.getItem('cfr_u'),
  key:      sessionStorage.getItem('cfr_k')
};
var editPath = null;
var mediaMode = 'insert';

function setMediaMode(mode) {
  mediaMode = mode;
  document.getElementById('mode-insert').classList.toggle('active', mode === 'insert');
  document.getElementById('mode-featured').classList.toggle('active', mode === 'featured');
  document.getElementById('media-hint').textContent = mode === 'featured'
    ? 'Click any image to use it as the featured card image.'
    : 'Click any image to insert it at the cursor position in the editor above.';
}

function updateFeaturedPreview(url) {
  var thumb = document.getElementById('featured-thumb');
  thumb.innerHTML = url ? '<img src="' + url + '" alt="featured">' : 'No image<br>set';
}

function setFeaturedImage(url) {
  document.getElementById('featured-url').value = url;
  updateFeaturedPreview(url);
  setMediaMode('insert');
  var s = document.getElementById('featured-status');
  s.textContent = '✓ Set';
  setTimeout(function() { s.textContent = ''; }, 2000);
}

function clearFeaturedImage() {
  document.getElementById('featured-url').value = '';
  updateFeaturedPreview('');
  document.getElementById('featured-status').textContent = '';
}

async function loadUpdates() {
  var list = document.getElementById('updates-list');
  list.innerHTML = '<p class="list-status">Loading…</p>';
  try {
    var res = await fetch('/api/updates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: auth.username, key: auth.key })
    });
    var data = await res.json();
    if (!res.ok || !data.ok) { list.innerHTML = '<p class="list-status">Could not load updates.</p>'; return; }
    if (!data.updates.length) { list.innerHTML = '<p class="list-status">No updates published yet.</p>'; return; }
    list.innerHTML = '';
    data.updates.forEach(function(u) {
      var row = document.createElement('div');
      row.className = 'update-row';
      var st = u.status || 'published';
      row.innerHTML =
        '<div class="update-info">' +
          '<span class="update-date">' + (u.date || '') + '</span>' +
          '<span class="update-title-text">' + escHtml(u.title) + '</span>' +
          (u.endDate ? '<span class="update-date" style="margin-left:0.5rem;">expires ' + u.endDate + '</span>' : '') +
        '</div>' +
        '<div class="update-actions">' +
          '<span class="badge badge-' + st + '">' + st + '</span>' +
          '<button class="btn btn-ghost btn-sm edit-btn">Edit</button>' +
          '<button class="btn btn-danger btn-sm del-btn">Delete</button>' +
        '</div>';
      row.querySelector('.edit-btn').addEventListener('click', function() { startEdit(u); });
      row.querySelector('.del-btn').addEventListener('click', function() { deleteUpdate(u.path, u.title); });
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = '<p class="list-status">Could not load updates.</p>';
  }
}

function startEdit(u) {
  editPath = u.path;
  document.getElementById('form-heading').textContent = 'Edit update';
  document.getElementById('pub-btn').textContent = 'Save changes';
  document.getElementById('cancel-btn').style.display = '';
  document.getElementById('title').value = u.title;
  document.getElementById('date').value = u.date;
  document.getElementById('summary').value = u.summary || '';
  document.getElementById('status').value = u.status || 'published';
  document.getElementById('end-date').value = u.endDate || '';
  document.getElementById('featured-url').value = u.image || '';
  updateFeaturedPreview(u.image || '');
  mde.value(u.content || '');
  document.getElementById('post-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  hideMsg('post-msg');
}

function cancelEdit() {
  editPath = null;
  document.getElementById('form-heading').textContent = 'New update';
  document.getElementById('pub-btn').textContent = 'Publish update';
  document.getElementById('cancel-btn').style.display = 'none';
  document.getElementById('post-form').reset();
  mde.value('');
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('status').value = 'published';
  document.getElementById('end-date').value = '';
  clearFeaturedImage();
  document.getElementById('upload-status').textContent = 'No image chosen';
  hideMsg('post-msg');
}

async function deleteUpdate(path, title) {
  if (!confirm('Delete "' + title + '"?\n\nThis cannot be undone.')) return;
  try {
    var res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: auth.username, key: auth.key, path })
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      loadUpdates();
      if (editPath === path) cancelEdit();
    } else {
      alert('Delete failed: ' + (data.error || 'please try again'));
    }
  } catch (e) {
    alert('Delete failed — please try again.');
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showMsg(id, type, text) {
  var el = document.getElementById(id);
  el.className = 'msg msg-' + type;
  el.textContent = text;
  el.style.display = '';
}

function hideMsg(id) {
  document.getElementById(id).style.display = 'none';
}

function initEditor() {
  if (mde) return;
  mde = new EasyMDE({
    element: document.getElementById('body'),
    spellChecker: false,
    placeholder: 'Write the full update here…',
    toolbar: ['bold', 'italic', 'heading-2', '|', 'unordered-list', 'ordered-list', '|', 'link', '|', 'preview', 'guide'],
    minHeight: '220px',
    status: false
  });
}

function showEditor() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('editor-view').style.display = '';
  document.getElementById('user-bar').style.display = '';
  document.getElementById('user-label').textContent = 'Logged in as ' + auth.username;
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
  initEditor();
  loadMedia();
  loadUpdates();
}

function showLogin() {
  document.getElementById('login-view').style.display = '';
  document.getElementById('editor-view').style.display = 'none';
  document.getElementById('user-bar').style.display = 'none';
}

function logout() {
  sessionStorage.removeItem('cfr_u');
  sessionStorage.removeItem('cfr_k');
  auth = { username: null, key: null };
  window.location.href = '/';
}

// Media library
async function loadMedia() {
  var grid = document.getElementById('media-grid');
  grid.innerHTML = '<p class="media-loading">Loading…</p>';
  try {
    var res = await fetch('/api/media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: auth.username, key: auth.key })
    });
    var data = await res.json();
    if (!res.ok || !data.ok) { grid.innerHTML = '<p class="media-empty">Could not load media.</p>'; return; }
    if (!data.files.length) { grid.innerHTML = '<p class="media-empty">No images uploaded yet. Use the upload button above to add images.</p>'; return; }
    grid.innerHTML = '';
    data.files.forEach(function(f) {
      var item = document.createElement('div');
      item.className = 'media-item';
      item.title = f.name + '\nClick to insert';
      item.innerHTML = '<img src="' + f.url + '" alt="' + f.name + '" loading="lazy"><span class="media-item-name">' + f.name + '</span>';
      item.addEventListener('click', function() {
        if (mediaMode === 'featured') {
          setFeaturedImage(f.url);
          item.classList.add('media-item-set');
          setTimeout(function() { item.classList.remove('media-item-set'); }, 1000);
        } else {
          var altText = f.name.replace(/[-_]/g, ' ').replace(/\.[^.]+$/, '');
          var md = '![' + altText + '](' + f.url + ')';
          mde.codemirror.replaceSelection(md);
          mde.codemirror.focus();
          item.classList.add('media-inserted');
          setTimeout(function() { item.classList.remove('media-inserted'); }, 1000);
        }
      });
      grid.appendChild(item);
    });
  } catch (e) {
    grid.innerHTML = '<p class="media-empty">Could not load media.</p>';
  }
}

// Restore session
if (auth.username && auth.key) {
  showEditor();
} else {
  showLogin();
}

// Login
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  hideMsg('login-msg');

  var username = document.getElementById('un').value.trim();
  var key = document.getElementById('ak').value;

  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, key })
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      sessionStorage.setItem('cfr_u', username);
      sessionStorage.setItem('cfr_k', key);
      auth = { username, key };
      showEditor();
    } else {
      showMsg('login-msg', 'err', 'Incorrect username or access key.');
    }
  } catch (err) {
    showMsg('login-msg', 'err', 'Could not connect — please try again.');
  }
  btn.disabled = false; btn.textContent = 'Log in';
});

// Image upload — uploads then refreshes media library
document.getElementById('img-file').addEventListener('change', async function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var statusEl = document.getElementById('upload-status');
  statusEl.textContent = 'Uploading…';

  var fd = new FormData();
  fd.append('username', auth.username);
  fd.append('key', auth.key);
  fd.append('file', file);

  try {
    var res = await fetch('/api/upload', { method: 'POST', body: fd });
    var data = await res.json();
    if (res.ok && data.ok) {
      var imgMd = '![' + file.name.replace(/\.[^.]+$/, '') + '](' + data.url + ')';
      mde.codemirror.replaceSelection(imgMd);
      mde.codemirror.focus();
      statusEl.textContent = '✓ ' + file.name + ' uploaded';
      loadMedia();
    } else {
      statusEl.textContent = '✗ Upload failed — ' + (data.error || 'try again');
    }
  } catch (err) {
    statusEl.textContent = '✗ Upload failed.';
  }
  e.target.value = '';
});

// Featured image URL typed manually
document.getElementById('featured-url').addEventListener('input', function() {
  updateFeaturedPreview(this.value.trim());
});

// Featured image upload
document.getElementById('featured-file').addEventListener('change', async function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var statusEl = document.getElementById('featured-status');
  statusEl.textContent = 'Uploading…';
  var fd = new FormData();
  fd.append('username', auth.username);
  fd.append('key', auth.key);
  fd.append('file', file);
  try {
    var res = await fetch('/api/upload', { method: 'POST', body: fd });
    var data = await res.json();
    if (res.ok && data.ok) {
      setFeaturedImage(data.url);
      loadMedia();
    } else {
      statusEl.textContent = '✗ Upload failed — ' + (data.error || 'try again');
    }
  } catch (err) {
    statusEl.textContent = '✗ Upload failed.';
  }
  e.target.value = '';
});

// Publish
document.getElementById('post-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('pub-btn');
  btn.disabled = true; btn.textContent = editPath ? 'Saving…' : 'Publishing…';
  hideMsg('post-msg');

  var body = mde.value().trim();
  if (!body) {
    showMsg('post-msg', 'err', 'Please write some content.');
    btn.disabled = false; btn.textContent = 'Publish update';
    return;
  }

  try {
    var res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: auth.username,
        key: auth.key,
        title:   document.getElementById('title').value.trim(),
        date:    document.getElementById('date').value,
        summary: document.getElementById('summary').value.trim(),
        status:  document.getElementById('status').value,
        endDate: document.getElementById('end-date').value || '',
        image:   document.getElementById('featured-url').value.trim(),
        content: body,
        ...(editPath ? { editPath } : {})
      })
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      var wasEdit = !!editPath;
      showMsg('post-msg', 'ok', wasEdit ? '✓ Update saved! Changes will appear on the site within a minute.' : '✓ Published! The update will appear on the site within a minute.');
      editPath = null;
      document.getElementById('form-heading').textContent = 'New update';
      document.getElementById('pub-btn').textContent = 'Publish update';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('post-form').reset();
      mde.value('');
      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('status').value = 'published';
      document.getElementById('end-date').value = '';
      clearFeaturedImage();
      document.getElementById('upload-status').textContent = 'No image chosen';
      loadUpdates();
    } else {
      showMsg('post-msg', 'err', '✗ ' + (data.error || 'Could not publish — please try again.'));
    }
  } catch (err) {
    showMsg('post-msg', 'err', '✗ Could not connect — please try again.');
  }
  btn.disabled = false; btn.textContent = 'Publish update';
});
</script>
</body>
</html>
